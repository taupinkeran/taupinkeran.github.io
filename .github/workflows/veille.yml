name: Actualisation Automatique Veille

on:
  schedule:
    - cron: '0 8 * * 1' # Tous les lundis à 08h00 UTC
  workflow_dispatch: # Pour lancer manuellement

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: pip install feedparser

      - name: Exécuter le script de veille
        run: python update_veille_2.py

      - name: Sauvegarder et publier les modifications
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add veille_2.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique de veille_2.html" && git push)
