name: Veille Automatique

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Autorise le push sur le dépôt

jobs:
  update-veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Exécuter le script de veille
        run: python update_veille_2.py

      - name: Sauvegarder et publier les modifications
        run: |
          git config --global --add safe.directory /github/workspace
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add veille.html
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update de la veille [skip ci]"
            git push
          else
            echo "Aucun changement détecté dans veille.html"
          fi
